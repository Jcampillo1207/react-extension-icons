name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Regenerate icons
        run: npm run generate-icons

      - name: Fail if generated sources drifted from svg/
        run: git diff --exit-code -- src

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - name: Check published package contents
        run: npm pack --dry-run
